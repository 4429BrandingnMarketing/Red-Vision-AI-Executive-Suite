name: Desktop Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['desktop-v*']

permissions:
  contents: read

jobs:
  mac-intel-dmg:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run desktop:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: red-vision-mac-intel
          path: release/*.dmg
          if-no-files-found: error
